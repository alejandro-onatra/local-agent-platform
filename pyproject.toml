# Python environment for repository scripts, managed by uv.
# mise pins Python/uv/Task; Task operates services; infra/ holds Docker/OTel
# configuration and host versions. Python dependencies belong in this file.
[project]
name = "agent-platform"
version = "0.1.0"
description = "Model-agnostic local agent platform with reproducible configuration, validation, and observability for Ollama, OpenHands, and OpenTelemetry."
readme = "README.md"
license = "MIT"
# Match mise exactly so synchronization does not select another interpreter.
requires-python = "==3.14.4"
dependencies = [
  # Safely read YAML configuration; this package does not run inference.
  "PyYAML==6.0.3",
]

[tool.uv]
# Script repository: do not build or install a distributable project package.
package = false
# mise supplies Python; uv only resolves/synchronizes virtualenv dependencies.
python-downloads = "never"
# Use locked wheels and hashes; avoid compiling dependencies on the host.
no-build = true
# Currently validated platform for the repository's host-side scripts.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
