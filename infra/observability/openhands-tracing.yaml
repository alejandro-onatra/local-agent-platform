services:
  openhands:
    networks:
    - agent-link
    - observability-data
    environment:
      OTEL_EXPORTER: otlp_http
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: openhands
      LMNR_TRACE_CONTENT: 'false'
      LMNR_INSTRUMENTS: ''
networks:
  observability-data:
    external: true
    name: agent-platform-observability_data
