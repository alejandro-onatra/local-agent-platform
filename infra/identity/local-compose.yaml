# Persistent local bootstrap only; no household LAN exposure or blueprint auto-application.
services:
  database:
    image: ${POSTGRES_IMAGE}
    platform: linux/amd64
    user: 70:70
    read_only: true
    restart: 'no'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - apparmor:docker-default
    networks:
    - database
    environment:
      POSTGRES_USER: identity_local
      POSTGRES_DB: identity_local
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
    - type: bind
      source: ${STATE_DIR}/database
      target: /var/lib/postgresql
      bind:
        create_host_path: false
    - type: bind
      source: ${PRIVATE_DIR}/postgres-password
      target: /run/secrets/db-password
      read_only: true
      bind:
        create_host_path: false
    tmpfs:
    - /var/run/postgresql:rw,nosuid,nodev,noexec,size=8m,uid=70,gid=70,mode=0700
    - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    shm_size: 16m
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - identity_local
      - -d
      - identity_local
      interval: 2s
      timeout: 3s
      retries: 40
  server:
    image: ${AUTHENTIK_IMAGE}
    platform: linux/amd64
    user: 1000:1000
    read_only: true
    restart: 'no'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - apparmor:docker-default
    networks:
    - frontend
    - database
    environment:
      PYTHONPATH: /
      DJANGO_SETTINGS_MODULE: authentik.root.settings
      AUTHENTIK_POSTGRESQL__HOST: database
      AUTHENTIK_POSTGRESQL__USER: identity_local
      AUTHENTIK_POSTGRESQL__NAME: identity_local
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/db-password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik-secret
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
      AUTHENTIK_LOG_LEVEL: error
      AUTHENTIK_AVATARS: initials
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: /tmp
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    volumes:
    - type: bind
      source: ${PRIVATE_DIR}/authentik-password
      target: /run/secrets/db-password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PRIVATE_DIR}/authentik-secret
      target: /run/secrets/authentik-secret
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${STATE_DIR}/data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ${STATE_DIR}/certs
      target: /certs
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
    command:
    - server
    ports:
    - 127.0.0.1:9000:9000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - ak
      - healthcheck
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
  worker:
    image: ${AUTHENTIK_IMAGE}
    platform: linux/amd64
    user: 1000:1000
    read_only: true
    restart: 'no'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - apparmor:docker-default
    networks:
    - database
    environment:
      PYTHONPATH: /
      DJANGO_SETTINGS_MODULE: authentik.root.settings
      AUTHENTIK_POSTGRESQL__HOST: database
      AUTHENTIK_POSTGRESQL__USER: identity_local
      AUTHENTIK_POSTGRESQL__NAME: identity_local
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/db-password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik-secret
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
      AUTHENTIK_LOG_LEVEL: error
      AUTHENTIK_AVATARS: initials
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: /tmp
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    volumes:
    - type: bind
      source: ${PRIVATE_DIR}/authentik-password
      target: /run/secrets/db-password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PRIVATE_DIR}/authentik-secret
      target: /run/secrets/authentik-secret
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${STATE_DIR}/data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ${STATE_DIR}/certs
      target: /certs
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
    command:
    - worker
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - ak
      - healthcheck
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
networks:
  database:
    internal: true
  frontend: {}
