# One-shot validation, not a production identity stack. No listeners or host ports.
services:
  database:
    image: ${POSTGRES_IMAGE}
    platform: linux/amd64
    user: '70:70'
    read_only: true
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, apparmor:docker-default]
    networks: [validation]
    environment:
      POSTGRES_USER: identity_probe
      POSTGRES_DB: identity_probe
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - type: bind
        source: ${PRIVATE_DIR}/postgres-password
        target: /run/secrets/db-password
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,nodev,noexec,size=256m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=8m,uid=70,gid=70,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    shm_size: 16m
    logging: {driver: none}
    healthcheck:
      test: [CMD, pg_isready, -U, identity_probe, -d, identity_probe]
      interval: 2s
      timeout: 3s
      retries: 40
  checker:
    image: ${AUTHENTIK_IMAGE}
    platform: linux/amd64
    user: '1000:1000'
    entrypoint: [python, -B, /candidate/native_validate.py]
    read_only: true
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, apparmor:docker-default]
    networks: [validation]
    environment:
      # Match the image source root when running a script mounted at /candidate.
      PYTHONPATH: /
      DJANGO_SETTINGS_MODULE: authentik.root.settings
      AUTHENTIK_POSTGRESQL__HOST: database
      AUTHENTIK_POSTGRESQL__USER: identity_probe
      AUTHENTIK_POSTGRESQL__NAME: identity_probe
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/db-password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik-secret
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
      AUTHENTIK_LOG_LEVEL: error
      AUTHENTIK_AVATARS: initials
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: /tmp
    volumes:
      - type: bind
        source: ${PRIVATE_DIR}/authentik-password
        target: /run/secrets/db-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PRIVATE_DIR}/authentik-secret
        target: /run/secrets/authentik-secret
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PUBLIC_DIR}/household-blueprint.yaml
        target: /candidate/household-blueprint.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PUBLIC_DIR}/native_validate.py
        target: /candidate/native_validate.py
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /data:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0700
      - /certs:rw,nosuid,nodev,noexec,size=8m,uid=1000,gid=1000,mode=0700
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    logging: {driver: none}
networks:
  validation:
    internal: true
