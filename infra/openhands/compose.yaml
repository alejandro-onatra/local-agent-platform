# Merge with infra/llm/compose.yaml; retain the existing Ollama project/volume.
services:
  ollama:
    networks: [default, agent-link]
  openhands:
    image: ghcr.io/openhands/agent-canvas@sha256:ce4526401c08b47d74fd0be5ebf97e8219d6a02955cb6710e8cc3335f01291a6
    platform: linux/amd64
    restart: "no"
    networks: [agent-link]
    group_add: ["${OH_HOST_GID:?Run scripts/openhands/up.sh}"]
    environment:
      OH_WORKSPACE_PATH: /projects/demo
      OH_MAX_CONCURRENT_RUNS: "1"
      OH_TELEMETRY_EXPORTER: none
      OH_TELEMETRY_CONSENT: "denied"
      DO_NOT_TRACK: "1"
      # Use bundled public pricing metadata; the agent network has no internet.
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      OPENHANDS_SUPPRESS_BANNER: "1"
      OH_ENABLE_VSCODE: "false"
    volumes:
      - openhands-state:/home/openhands/.openhands
      - type: bind
        source: ${OH_WORKSPACE:?Run scripts/openhands/up.sh}
        target: /projects
        bind:
          create_host_path: false
    mem_limit: 6g
    cpus: 4
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  openhands-proxy:
    image: nginx@sha256:8f84ed99befc3891b8f329c5c202785278a2cfb7c25107d57fb2a134a3117433
    platform: linux/amd64
    user: "101:101"
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    restart: "no"
    ports: ["127.0.0.1:8000:8080"]
    networks: [default, agent-link]
    depends_on: [openhands]
    volumes:
      - ../openhands/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m,mode=1777"]
    mem_limit: 64m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  agent-link:
    internal: true
volumes:
  openhands-state:
