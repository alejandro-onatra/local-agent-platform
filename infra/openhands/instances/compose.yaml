# Rendered separately for each synthetic UID; no shared agent/model network.
services:
  openhands:
    image: ${PILOT_IMAGE}
    platform: linux/amd64
    user: ${PILOT_USER}
    init: true
    entrypoint: [bash, /opt/pilot/entrypoint.sh]
    restart: 'no'
    read_only: true
    networks: [backend]
    environment:
      HOME: /home/openhands
      USER: openhands
      LOGNAME: openhands
      OH_WORKSPACE_PATH: /projects
      OH_MAX_CONCURRENT_RUNS: '1'
      OH_ENABLE_VSCODE: 'false'
      OH_ENABLE_BROWSER: 'false'
      VITE_ENABLE_BROWSER_TOOLS: 'false'
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: 'false'
      OH_TELEMETRY_EXPORTER: none
      OH_TELEMETRY_CONSENT: denied
      DO_NOT_TRACK: '1'
      VITE_DO_NOT_TRACK: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      OPENHANDS_SUPPRESS_BANNER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - {type: bind, source: '${PILOT_STATE}', target: /home/openhands, bind: {create_host_path: false}}
      # Explicit child bind overrides the image VOLUME; never create anonymous state.
      - {type: bind, source: '${PILOT_STATE}/.openhands', target: /home/openhands/.openhands, bind: {create_host_path: false}}
      - {type: bind, source: '${PILOT_WORKSPACE}', target: /projects, bind: {create_host_path: false}}
      - {type: bind, source: '${PILOT_WORKSPACE}', target: /home/openhands/workspace, bind: {create_host_path: false}}
      - {type: bind, source: '${PILOT_CONTROL}/passwd', target: /etc/passwd, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${PILOT_CONTROL}/group', target: /etc/group, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${PILOT_LAUNCHER}', target: /usr/local/bin/openhands-agent-server, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${PILOT_ENTRYPOINT}', target: /opt/pilot/entrypoint.sh, read_only: true, bind: {create_host_path: false}}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /home/openhands/.cache:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=${PILOT_UID},gid=${PILOT_UID}
      - /home/openhands/.config:rw,nosuid,nodev,noexec,size=32m,mode=0700,uid=${PILOT_UID},gid=${PILOT_UID}
      - /home/openhands/.local:rw,nosuid,nodev,noexec,size=32m,mode=0700,uid=${PILOT_UID},gid=${PILOT_UID}
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, apparmor:docker-default]
    logging: {driver: json-file, options: {max-size: 2m, max-file: '2'}}
  ingress:
    image: ${PILOT_PROXY_IMAGE}
    platform: linux/amd64
    user: '101:101'
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    restart: 'no'
    read_only: true
    networks: [frontend, backend]
    ports: ['127.0.0.1:${PILOT_PORT}:8080']
    depends_on: [openhands]
    volumes:
      - {type: bind, source: '${PILOT_NGINX}', target: /etc/nginx/nginx.conf, read_only: true, bind: {create_host_path: false}}
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777']
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, apparmor:docker-default]
    logging: {driver: json-file, options: {max-size: 2m, max-file: '2'}}
networks:
  backend: {internal: true}
  frontend: {}
