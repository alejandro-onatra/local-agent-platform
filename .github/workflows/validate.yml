name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified pinned mise
        run: |
          bash scripts/bootstrap/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare locked environment
        run: |
          mise trust mise.toml
          mise install --locked
          mise env -s bash > "$RUNNER_TEMP/mise-env.sh"
          printf 'BASH_ENV=%s\n' "$RUNNER_TEMP/mise-env.sh" >> "$GITHUB_ENV"
          source "$RUNNER_TEMP/mise-env.sh"
          task env:python:setup
      - name: Verify native PKI tooling before security tests
        run: task env:ci:check
      - name: Run the same validation as local commits
        run: task repo:commit:check
      - name: Run disposable Authentik and PostgreSQL integration
        run: task identity:native:check
      - name: Prepare synthetic storage for Compose integration
        run: |
          task env:storage:setup
          task env:storage:check
      - name: Pull the pinned Compose integration images
        shell: bash
        run: |
          set -euo pipefail
          openhands_image="$(python -c 'from pathlib import Path; import yaml; print(yaml.safe_load(Path("infra/openhands/versions.yaml").read_text())["image"])')"
          ingress_image="$(python -c 'from pathlib import Path; import yaml; print(yaml.safe_load(Path("infra/openhands/versions.yaml").read_text())["proxy"]["image"])')"
          docker --context default pull "$openhands_image"
          docker --context default pull "$ingress_image"
      - name: Run two-instance OpenHands Compose integration
        run: |
          task openhands:instances:plan
          touch "$RUNNER_TEMP/openhands-instances-up-attempted"
          task openhands:instances:up
          task openhands:instances:check
          task openhands:instances:accept
          task openhands:instances:network:check
          task openhands:instances:websocket:check
          task openhands:instances:recovery:check
      - name: Stop synthetic instances and unmount CI storage
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openhands-instances-up-attempted" ]]; then
            task openhands:instances:down
            down_status=$?
          else
            echo "No OpenHands pilot startup was attempted; skipping down."
            down_status=0
          fi
          task storage:unmount
          unmount_status=$?
          if (( down_status != 0 || unmount_status != 0 )); then
            exit 1
          fi
