name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified pinned mise
        run: |
          bash scripts/bootstrap/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare locked environment
        run: |
          mise trust mise.toml
          mise install --locked
          mise run env:python:setup
      - name: Verify native PKI tooling before security tests
        run: mise run env:pki:check
      - name: Run the same validation as local commits
        run: mise exec -- task repo:commit:check
