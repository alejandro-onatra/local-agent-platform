name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
      MISE_HTTP_RETRIES: '8'
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified pinned mise
        run: |
          bash scripts/bootstrap/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare locked environment
        run: |
          mise trust mise.toml
          mise install --locked
          mise run env:python:setup
      - name: Verify native PKI tooling before security tests
        run: mise run env:ci:check
      - name: Run the same validation as local commits
        run: mise exec -- task repo:commit:check
      - name: Run disposable Authentik and PostgreSQL integration
        run: mise exec -- task identity:native:check
      - name: Prepare synthetic storage for Compose integration
        run: |
          touch "$RUNNER_TEMP/storage-setup-attempted"
          mise run env:storage:setup
          mise run env:storage:check
      - name: Pull the pinned Compose integration images
        shell: bash
        run: |
          set -euo pipefail
          openhands_image="$(mise exec -- python -c 'from pathlib import Path; import yaml; print(yaml.safe_load(Path("infra/openhands/versions.yaml").read_text())["image"])')"
          ingress_image="$(mise exec -- python -c 'from pathlib import Path; import yaml; print(yaml.safe_load(Path("infra/openhands/versions.yaml").read_text())["proxy"]["image"])')"
          docker --context default pull "$openhands_image"
          docker --context default pull "$ingress_image"
      - name: Run two-instance OpenHands Compose integration
        run: |
          mise exec -- task openhands:instances:plan
          touch "$RUNNER_TEMP/openhands-instances-up-attempted"
          mise exec -- task openhands:instances:up
          mise exec -- task openhands:instances:check
          mise exec -- task openhands:instances:accept
          mise exec -- task openhands:instances:network:check
          mise exec -- task openhands:instances:websocket:check
          mise exec -- task openhands:instances:recovery:check
      - name: Stop synthetic instances and unmount CI storage
        if: always()
        shell: bash
        run: |
          set +e
          if ! command -v mise >/dev/null 2>&1; then
            echo "mise is unavailable; skipping cleanup tasks."
            exit 0
          fi
          if [[ -f "$RUNNER_TEMP/openhands-instances-up-attempted" ]]; then
            mise exec -- task openhands:instances:down
            down_status=$?
          else
            echo "No OpenHands pilot startup was attempted; skipping down."
            down_status=0
          fi
          if [[ -f "$RUNNER_TEMP/storage-setup-attempted" ]]; then
            mise exec -- task storage:unmount
            unmount_status=$?
          else
            echo "Storage setup was not attempted; skipping unmount."
            unmount_status=0
          fi
          if (( down_status != 0 || unmount_status != 0 )); then
            exit 1
          fi
