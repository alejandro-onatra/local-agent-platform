# Keep the official rules from the binary pinned in mise.lock.
title = "Local agent platform: secret detection"
[extend]
useDefault = true

# Local master keys use sk- followed by 32 hexadecimal-encoded bytes.
[[rules]]
id = "local-litellm-master-key"
description = "Master key format generated for the local proxy"
regex = '''\bsk-[a-f0-9]{64}\b'''
keywords = ["sk-"]
