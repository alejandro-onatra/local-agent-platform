# mise owns environment versions, preparation and validation.
# Taskfile.yml owns service operations and code tests; scripts/ owns implementation.
# Host packages and image digests are pinned in infra/host/versions.yaml.

# Exact versions; artifacts and checksums are recorded in mise.lock.
[tools]
task = "3.54.0"
python = "3.14.4"
uv = "0.12.23"
# Secret detector; bundled rules are pinned by version and binary checksum.
gitleaks = "8.30.1"
# Native public-key backup encryption; no private recovery key is kept in Git.
age = "1.3.2"
# Stable offline PKI tooling; native CLI name is step.
"aqua:smallstep/cli" = "0.30.6"
# Native gateway configuration validation; deployment uses a digest-pinned image.
caddy = "2.11.7"

# mise activates the project venv; uv installs the dependencies from pyproject.toml.
[env]
_.python.venv = { path = ".venv", create = true }

[tasks."env:plan"]
description = "Check Python/uv/dependencies and repository structure; preview Docker/Toolkit installation."
run = "bash scripts/environment/plan.sh"

[tasks."env:setup"]
description = "Synchronize Python with uv, check GPU and install Docker/Toolkit; requires sudo and may restart Docker."
run = "bash scripts/environment/setup.sh"

[tasks."env:check"]
description = "Validate Python/uv/lock, repository structure, GPU driver and Docker/GPU in the host terminal."
run = "bash scripts/environment/check.sh"

[tasks."env:python:setup"]
description = "Synchronize .venv from pyproject.toml and uv.lock with uv sync --locked; no sudo."
run = "bash scripts/environment/setup-python.sh"

[tasks."env:python:check"]
description = "Check versions and .venv synchronization against uv.lock without installing dependencies."
run = "bash scripts/environment/check-python.sh"

[tasks."repo:check"]
description = "Check required files and shell syntax throughout the repository."
run = "bash scripts/repo/check-repo.sh"

[tasks."gpu:check"]
description = "Inspect host GPU, NVIDIA driver and device nodes; save a local diagnostic."
run = "bash scripts/host/check-gpu.sh"

[tasks."docker:plan"]
description = "Preview pinned packages and Docker/Toolkit installer actions without installing."
run = "bash scripts/host/install-docker-gpu.sh --plan"

[tasks."docker:install"]
description = "Install pinned packages and configure NVIDIA/Docker; requires sudo and checks active services."
run = "bash scripts/host/install-docker-gpu.sh --apply"

[tasks."docker:check"]
description = "Check Docker/Compose/Buildx and GPU in a temporary container; may require sudo."
run = "bash scripts/host/check-docker-gpu.sh"

[tasks."repo:hooks:install"]
description = "Install versioned Git hooks for this checkout; preserve any different existing hooks path."
run = "bash scripts/repo/install-hooks.sh"

[tasks."repo:hooks:check"]
description = "Verify this checkout uses the executable versioned pre-commit hook."
run = "bash scripts/repo/check-hooks.sh"

# Phase-A environment inspection only; no VM allocation or network changes.
[tasks."env:lan:inventory"]
description = "Inspect host resources, visible KVM support and LAN networking without changing the host."
run = "bash scripts/environment/inventory-lan.sh"

# Synthetic storage environment; does not migrate the current single-agent demo.
[tasks."env:storage:plan"]
description = "Inspect storage tools and reserve budget for two synthetic fixed-size filesystems per UID; no allocation."
run = "bash scripts/storage/run.sh plan"

[tasks."env:storage:setup"]
description = "Prepare/remount 512 MiB of private synthetic ext4 images outside CloudDrive; requires host sudo, preserves existing services/data."
run = "bash scripts/storage/run.sh setup"

[tasks."env:storage:check"]
description = "Verify exact pilot backing files, active mounts, UID permissions and capacity; requires host sudo, no writes to filesystems."
run = "bash scripts/storage/run.sh check"

# Source-only Authentik configuration validation; no identity stack deployment.
[tasks."env:identity:check"]
description = "Validate candidate MFA blueprint, pinned images and disposable/persistent/rehearsal sources without Docker or credentials."
run = "bash scripts/identity/check-source.sh"

# Persistent loopback identity storage and file-based credentials only; starts no service.
[tasks."env:identity:setup"]
description = "Prepare root-private local identity storage/credentials outside Git and CloudDrive; preserve existing keys. Requires sudo."
run = "bash scripts/identity/local.sh setup"

[tasks."env:identity:backup:check"]
description = "Verify pinned backup encryption tools and Linux descriptor support; no keys or service changes."
run = "bash scripts/identity/check-backup-tools.sh"

# Offline ceremony tools/source only; no root key or USB writes during setup/check.
[tasks."env:pki:setup"]
description = "Install the pinned Smallstep CLI and validate PKI tooling; no key generation, trust or media changes."
run = "bash scripts/pki/environment.sh setup"

[tasks."env:pki:check"]
description = "Verify pinned Smallstep and offline ceremony source/host tools without creating keys or changing connectivity."
run = "bash scripts/pki/environment.sh check"

# HTTPS login gateway; setup caches the exact image but does not start services.
[tasks."env:gateway:setup"]
description = "Install locked native Caddy, verify PKI tools and cache the pinned gateway image using host sudo; no service startup or trust installation."
run = "bash scripts/gateway/environment.sh setup"

[tasks."env:gateway:check"]
description = "Check gateway source, immutable image declaration and native Caddy/PKI tools; no credentials or Docker needed."
run = "bash scripts/gateway/environment.sh check"

# Dedicated real-user storage; never repurpose synthetic test images/UIDs.
[tasks."env:household:setup"]
description = "Prepare separate 2 GiB workspaces/512 MiB state filesystems for alejandro and kimberly, cache pinned images and validate native modules; no users or service startup. Requires sudo."
run = "bash scripts/household/run.sh environment"
